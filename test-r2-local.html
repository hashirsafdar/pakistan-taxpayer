<!DOCTYPE html>
<html>
<head>
    <title>R2 Range Request Test</title>
</head>
<body>
    <h1>Testing R2 Range Requests</h1>
    <button onclick="testRangeRequest()">Test Range Request</button>
    <button onclick="testDuckDB()">Test DuckDB-WASM</button>
    <pre id="output"></pre>

    <script type="module">
        import * as duckdb from "https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.32.0/+esm";

        const r2Url = "https://pub-04b8843e76a74070afe36126dfc680ed.r2.dev/all.parquet";
        const output = document.getElementById("output");

        function log(msg) {
            output.textContent += msg + "\n";
        }

        window.testRangeRequest = async function() {
            output.textContent = "";
            log("Testing HTTP Range Request...\n");

            try {
                // Test HEAD request
                log("1. HEAD request:");
                const headResp = await fetch(r2Url, { method: "HEAD" });
                log(`   Status: ${headResp.status}`);
                log(`   Accept-Ranges: ${headResp.headers.get("accept-ranges")}`);
                log(`   Content-Length: ${headResp.headers.get("content-length")}`);
                log(`   Access-Control-Allow-Origin: ${headResp.headers.get("access-control-allow-origin")}`);
                log("");

                // Test Range request
                log("2. GET with Range header (bytes=0-1023):");
                const rangeResp = await fetch(r2Url, {
                    headers: { "Range": "bytes=0-1023" }
                });
                log(`   Status: ${rangeResp.status} (should be 206)`);
                log(`   Content-Length: ${rangeResp.headers.get("content-length")} (should be 1024)`);
                log(`   Content-Range: ${rangeResp.headers.get("content-range")}`);
                log(`   Accept-Ranges: ${rangeResp.headers.get("accept-ranges")}`);

                const data = await rangeResp.arrayBuffer();
                log(`   Actual bytes received: ${data.byteLength}`);
                log("");

                // Check magic bytes
                const view = new Uint8Array(data);
                const magic = String.fromCharCode(view[0], view[1], view[2], view[3]);
                log(`   Parquet magic bytes: ${magic} (should be PAR1)`);

            } catch (error) {
                log(`ERROR: ${error.message}`);
            }
        };

        window.testDuckDB = async function() {
            output.textContent = "";
            log("Testing DuckDB-WASM with R2...\n");

            try {
                log("Initializing DuckDB-WASM...");
                const JSDELIVR_BUNDLES = duckdb.getJsDelivrBundles();
                const bundle = await duckdb.selectBundle(JSDELIVR_BUNDLES);
                const worker_url = URL.createObjectURL(
                    new Blob([`importScripts("${bundle.mainWorker}");`], {
                        type: "text/javascript",
                    })
                );
                const worker = new Worker(worker_url);
                const logger = new duckdb.ConsoleLogger();
                const db = new duckdb.AsyncDuckDB(logger, worker);
                await db.instantiate(bundle.mainModule, bundle.pthreadWorker);

                // Open database with filesystem configuration
                log("Opening database with config:");
                log(`   allowFullHTTPReads: true (allow fallback)`);
                log(`   forceFullHTTPReads: false (prefer range requests)`);
                log(`   reliableHeadRequests: true (trust HEAD)\n`);

                try {
                    await db.open({
                        filesystem: {
                            allowFullHTTPReads: true,
                            forceFullHTTPReads: false,
                            reliableHeadRequests: true
                        }
                    });
                    log("✓ Database opened with filesystem config\n");
                } catch (e) {
                    log(`⚠ Could not open with config: ${e.message}`);
                    log("Opening without config...\n");
                }

                const conn = await db.connect();

                log("Running query...");
                const startTime = performance.now();
                const result = await conn.query(`
                    SELECT COUNT(*) as count
                    FROM '${r2Url}'
                    WHERE id_type = 'cnic' AND id = '3520223800364'
                `);
                const endTime = performance.now();

                const rows = result.toArray();
                log(`✓ Query complete in ${(endTime - startTime).toFixed(2)}ms`);
                log(`Result: ${JSON.stringify(rows)}`);
                log("\nCheck Network tab to see if range requests were used!");

            } catch (error) {
                log(`ERROR: ${error.message}`);
                log(error.stack);
            }
        };
    </script>
</body>
</html>
