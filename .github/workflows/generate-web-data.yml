name: Generate Web Visualization Data

on:
  push:
    paths:
      - 'docs/data/all.parquet'
      - 'scripts/generate_web_data.py'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: uv pip install duckdb

      - name: Generate visualization data
        run: uv run scripts/generate_web_data.py

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet docs/data/web/; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/web/*.json
          git commit -m "Auto-generate visualization data"
          git push
